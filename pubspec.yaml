name: swipegallery
description: "Organiza tu galería de manera rápida y divertida."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  home_widget: ^0.10.0
  photo_manager: ^3.9.0
  provider: ^6.1.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/titulo.png
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"